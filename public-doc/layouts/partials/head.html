{{- $description := .Description | default .Summary | default site.Params.description -}}
{{- $css := resources.Get "css/site.css" | minify | fingerprint -}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08090c">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ $description | plainify }}">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="icon" href="{{ "brand/livebound-favicon.svg" | relURL }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ $description | plainify }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ site.Title }}">
{{ partial "analytics.html" . }}
